<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#481f4e"/>
  <!-- 8-Pointed Star rotated 0 deg -->
  <rect x="18" y="18" width="28" height="28" rx="1" fill="none" stroke="#c39565" stroke-width="4.5" stroke-linejoin="round" transform="rotate(0 32 32)"/>
  <!-- 8-Pointed Star rotated 45 deg -->
  <rect x="18" y="18" width="28" height="28" rx="1" fill="none" stroke="#c39565" stroke-width="4.5" stroke-linejoin="round" transform="rotate(45 32 32)"/>
  <!-- Inner solid gold diamond/star accent from logo -->
  <rect x="25.5" y="25.5" width="13" height="13" rx="1" fill="#c39565" transform="rotate(45 32 32)"/>
</svg>
